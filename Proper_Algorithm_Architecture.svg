<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 32px 'Segoe UI', system-ui, sans-serif; fill: #1E293B; }
    .subtitle { font: 500 20px 'Segoe UI', system-ui, sans-serif; fill: #64748B; }
    .node-text { font: 600 15px 'Segoe UI', system-ui, sans-serif; fill: #FFFFFF; }
    .desc-text { font: 400 13px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
    .logic-text { font: italic 600 14px 'Segoe UI', system-ui, sans-serif; fill: #2563EB; }
    .path-text { font: 500 13px 'Segoe UI', system-ui, sans-serif; fill: #94A3B8; }
  </style>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="blue_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="cyan_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#CBD5E1" />
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#F8FAFC" rx="40" />

  <text x="60" y="60" class="title">HosteliHub Logic Flow Architecture</text>
  <text x="60" y="90" class="subtitle">Core Algorithmic Engine: Gatepass &amp; State Management</text>

  <!-- START -->
  <circle cx="600" cy="140" r="30" fill="#334155" />
  <text x="600" y="145" text-anchor="middle" class="node-text">START</text>
  
  <!-- Trigger -->
  <path d="M600,170 V210" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="480" y="210" width="240" height="60" rx="12" fill="url(#blue_grad)" />
  <text x="600" y="245" text-anchor="middle" class="node-text">REQUEST INITIATION</text>
  <text x="730" y="240" class="desc-text">(Student Input: Timestamps, Roll No)</text>

  <!-- Algorithm Check 1 -->
  <path d="M600,270 V310" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowhead)" />
  <polygon points="600,310 700,360 600,410 500,360" fill="#FACC15" />
  <text x="600" y="365" text-anchor="middle" class="node-text" style="fill:#334155">VALID?</text>
  <text x="705" y="350" class="logic-text">No: Reject &amp; Notify</text>
  <text x="705" y="375" class="logic-text">Yes: State Change</text>

  <!-- State Transition PENDING -->
  <path d="M600,410 V460" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="450" y="460" width="300" height="80" rx="40" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />
  <text x="600" y="500" text-anchor="middle" style="fill:#475569; font-weight:700">STATE: PENDING APPROVAL</text>
  <text x="600" y="520" text-anchor="middle" style="fill:#64748B; font-size:12px">Real-time Broadcast Triggered</text>

  <!-- Decision Node: Warden -->
  <path d="M600,540 V590" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowhead)" />
  <polygon points="600,590 750,650 600,710 450,650" fill="url(#cyan_grad)" />
  <text x="600" y="655" text-anchor="middle" class="node-text">WARDEN ACTION</text>
  <text x="760" y="655" class="desc-text">Digital Signature Logic</text>

  <!-- Token Generation Branch -->
  <path d="M600,710 V760" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="480" y="760" width="240" height="60" rx="10" fill="#10B981" />
  <text x="600" y="795" text-anchor="middle" class="node-text">GENERATE QR TOKEN</text>
  <text x="730" y="790" class="desc-text">Hash(UUID + Time + RollNo)</text>

  <!-- Verification Step -->
  <path d="M720,790 H880 V840" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrowhead)" fill="none" />
  <rect x="880" y="740" width="220" height="100" rx="15" fill="#FFFFFF" stroke="#10B981" stroke-width="2" stroke-dasharray="5,5" />
  <text x="990" y="775" text-anchor="middle" style="fill:#065F46; font-weight:bold">SECURITY SCAN</text>
  <text x="990" y="800" text-anchor="middle" class="desc-text">Live Database Correlation</text>
  <text x="990" y="820" text-anchor="middle" style="fill:#059669; font-size:11px">Transition: IN / OUT</text>

  <!-- Notification Flow -->
  <path d="M480,240 H200 V800 H450" stroke="#F43F5E" stroke-width="2" stroke-dasharray="10,5" marker-end="url(#arrowhead)" fill="none" />
  <text x="180" y="500" transform="rotate(-90, 180, 500)" style="fill:#F43F5E; font-size:14px; font-weight:bold">PARENT/WARDEN SYNC (EMAIL &amp; WEB)</text>

  <!-- END -->
  <circle cx="600" cy="850" r="20" fill="#334155" />
  <text x="600" y="855" text-anchor="middle" class="node-text" style="font-size:10px">END</text>

</svg>
