<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="2" dy="5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)" rx="24" />

  <!-- Building Blocks Silhouettes -->
  <!-- Block A -->
  <rect x="50" y="550" width="120" height="100" fill="#cbd5e1" opacity="0.8" rx="4" />
  <text x="110" y="665" font-family="Arial" font-size="14" font-weight="900" fill="#64748b" text-anchor="middle">BLOCK-A</text>
  
  <!-- Admission Block -->
  <rect x="250" y="500" width="150" height="150" fill="#94a3b8" opacity="0.8" rx="4" />
  <text x="325" y="665" font-family="Arial" font-size="14" font-weight="900" fill="#475569" text-anchor="middle">ADMISSION HUB</text>

  <!-- Management Center -->
  <rect x="550" y="530" width="180" height="120" fill="#94a3b8" opacity="0.8" rx="4" />
  <text x="640" y="665" font-family="Arial" font-size="14" font-weight="900" fill="#475569" text-anchor="middle">SECURITY & OPS</text>

  <!-- Ground Layer -->
  <rect x="0" y="640" width="1000" height="60" fill="#22c55e" opacity="0.2" />

  <!-- Title Center -->
  <rect x="300" y="20" width="400" height="60" rx="30" fill="#2563eb" filter="url(#shadow)" />
  <text x="500" y="58" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">HosteliHub Multi-Portal Algorithm</text>

  <!-- FEATURE BUBBLES - 16 Total -->

  <!-- Top: Central Intelligence -->
  <line x1="500" y1="80" x2="500" y2="150" stroke="#2563eb" stroke-width="2" stroke-dasharray="8" />
  <rect x="400" y="150" width="200" height="40" rx="20" fill="#1e293b" filter="url(#shadow)" />
  <text x="500" y="175" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">AI-Driven Data Analytics</text>

  <!-- Row 1 -->
  <rect x="50" y="250" width="160" height="40" rx="20" fill="#3b82f6" filter="url(#shadow)" />
  <text x="130" y="275" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Automated Onboarding</text>
  
  <rect x="230" y="250" width="160" height="40" rx="20" fill="#10b981" filter="url(#shadow)" />
  <text x="310" y="275" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Daily Attendance Tracker</text>

  <rect x="410" y="250" width="180" height="40" rx="20" fill="#f59e0b" filter="url(#shadow)" />
  <text x="500" y="275" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Compatible Roommate Match</text>

  <rect x="610" y="250" width="160" height="40" rx="20" fill="#ef4444" filter="url(#shadow)" />
  <text x="690" y="275" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">QR Gatepass Security</text>

  <rect x="790" y="250" width="160" height="40" rx="20" fill="#8b5cf6" filter="url(#shadow)" />
  <text x="870" y="275" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Integrated Fee Portal</text>

  <!-- Row 2 -->
  <rect x="50" y="320" width="160" height="40" rx="20" fill="#ec4899" filter="url(#shadow)" />
  <text x="130" y="345" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Community Gallery</text>

  <rect x="230" y="320" width="160" height="40" rx="20" fill="#06b6d4" filter="url(#shadow)" />
  <text x="310" y="345" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Smart Bed Allotment</text>

  <rect x="410" y="320" width="180" height="40" rx="20" fill="#14b8a6" filter="url(#shadow)" />
  <text x="500" y="345" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Leave & Outing Logic</text>

  <rect x="610" y="320" width="160" height="40" rx="20" fill="#f97316" filter="url(#shadow)" />
  <text x="690" y="345" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Modernized Cafeteria</text>

  <rect x="790" y="320" width="160" height="40" rx="20" fill="#6366f1" filter="url(#shadow)" />
  <text x="870" y="345" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Parent Monitoring Hub</text>

  <!-- Row 3 -->
  <rect x="140" y="390" width="160" height="40" rx="20" fill="#84cc16" filter="url(#shadow)" />
  <text x="220" y="415" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Medicine Availability</text>

  <rect x="320" y="390" width="180" height="40" rx="20" fill="#475569" filter="url(#shadow)" />
  <text x="410" y="415" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Hostel Inventory Tracker</text>

  <rect x="520" y="390" width="160" height="40" rx="20" fill="#dc2626" filter="url(#shadow)" />
  <text x="600" y="415" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Digitized Maintenance</text>

  <rect x="700" y="390" width="160" height="40" rx="20" fill="#2563eb" filter="url(#shadow)" />
  <text x="780" y="415" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Study Material Hub</text>

  <!-- Connectors -->
  <path d="M500 190 L500 250" stroke="#94a3b8" stroke-width="1" />
  <path d="M130 290 L110 550" stroke="#94a3b8" stroke-width="1" opacity="0.3" />
  <path d="M310 290 L325 500" stroke="#94a3b8" stroke-width="1" opacity="0.3" />
  <path d="M690 290 L640 530" stroke="#94a3b8" stroke-width="1" opacity="0.3" />
  
  <rect x="400" y="450" width="200" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="500" y="470" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle" font-weight="bold">SINGLE POINT ARCHITECTURE</text>
  
</svg>
